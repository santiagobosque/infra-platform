---
- name: Install K3s on dev host
  hosts: k3s
  become: true
  serial: 1

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Check if K3s is running
      command: systemctl is-active k3s
      register: k3s_status
      failed_when: k3s_status.stdout != "active"
      changed_when: false

    - name: Check if kubeconfig already exists locally
      stat:
        path: "{{ lookup('env', 'HOME') }}/.kube/config"
      register: kubeconfig_file
      delegate_to: localhost
      become: false

    - name: Check existing contexts in local kubeconfig
      ansible.builtin.command:
        cmd: "kubectl config get-contexts -o name --kubeconfig={{ lookup('env', 'HOME') }}/.kube/config"
      register: kube_contexts
      delegate_to: localhost
      become: false
      when: kubeconfig_file.stat.exists
      changed_when: false
      failed_when: false

    - name: Decide whether we need to fetch/merge this environment's kubeconfig
      ansible.builtin.set_fact:
        need_kubeconfig: >-
          {{ not kubeconfig_file.stat.exists or
              environment_name not in (kube_contexts.stdout_lines | default([])) }}

    - name: Fetch kubeconfig locally
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/tmp/kubeconfig-{{ environment_name }}"
        flat: yes
      when: need_kubeconfig

    - name: Replace server address in kubeconfig
      replace:
        path: "/tmp/kubeconfig-{{ environment_name }}"
        regexp: '127.0.0.1'
        replace: "{{ ansible_host }}"
      delegate_to: localhost
      become: false
      when: need_kubeconfig

    - name: Rename context/cluster/user in kubeconfig to environment name
      replace:
        path: "/tmp/kubeconfig-{{ environment_name }}"
        regexp: '(:\s+)default$'
        replace: '\1{{ environment_name }}'
      delegate_to: localhost
      become: false
      when: need_kubeconfig

    - name: Ensure ~/.kube directory exists locally
      file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false

    - name: Merge kubeconfigs in default location
      ansible.builtin.shell: |
        KUBECONFIG="{{ lookup('env', 'HOME') }}/.kube/config:/tmp/kubeconfig-{{ environment_name }}" \
        kubectl config view --flatten > /tmp/kubeconfig-merged
      delegate_to: localhost
      become: false
      when: need_kubeconfig
      changed_when: true

    - name: Replace default kubeconfig with merged version
      ansible.builtin.copy:
        src: /tmp/kubeconfig-merged
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        mode: '0600'
        remote_src: true
      delegate_to: localhost
      become: false
      when: need_kubeconfig

